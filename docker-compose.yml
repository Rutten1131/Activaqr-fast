version: '3.8'

services:
  activaqr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activaqr-app
    restart: always
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/auth/validate 2>/dev/null || wget -q --spider http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
